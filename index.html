<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ジェネラティブアート図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かで精密な数学図版の図鑑。線そのものが主役
   IDEA: 図版を一枚ずつ並べた標本カタログ(プレート集)。上の一枚は動く
   PICTURE: 上部の大きなプレートで、描画アニメと動きアニメを再生
   COLOUR and TYPE: 白/墨の地に系統ごとの単色インク。Zen Kaku Gothic New
   LAYOUT: タイトル→再生プレートと解説→系統リンク→11系統の図版グリッド */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--ink:light-dark(#1d1d1f,#ececec);--sub:light-dark(#5d5d62,#a6a6ad);--line:light-dark(#e4e4e2,#2c2d32);--plate:light-dark(#f4f4f1,#1b1c20)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html:lang(zh-Hant) body{font-family:"Noto Sans TC",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px);max-width:1320px;margin:0 auto}
h1{font-size:clamp(32px,5vw,48px);line-height:1.1;margin:0 0 10px;font-weight:700;text-wrap:balance}
.lead{color:var(--sub);margin:0;max-width:62ch}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lang{display:flex;gap:4px;flex:none}
.lang button{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.lang button[aria-pressed=true]{border-color:var(--ink);font-weight:700}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-top:28px}
.hero canvas{width:100%;aspect-ratio:1;display:block;background:var(--plate);border-radius:6px}
.tag{display:inline-block;font-size:13px;font-weight:500;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:2px 12px}
.hero h2{font-size:clamp(28px,3.6vw,40px);line-height:1.15;margin:14px 0 18px;font-weight:700}
.hero dl{margin:0}.hero dt{font-size:13px;color:var(--sub);margin-top:14px}.hero dd{margin:2px 0 0;font-size:17px}
.ctl{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.ctl button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.ctl button:hover{border-color:var(--sub)}
.ctl button.on{border-color:var(--c);color:var(--c);font-weight:500}
.ctl button[hidden]{display:none}
.mvnote{font-size:14px;color:var(--sub);margin:12px 0 0;min-height:1.6em}
button:focus-visible{outline:2px solid var(--c,#378ADD);outline-offset:2px}
nav{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
nav .scroll{display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px);max-width:1320px;margin:0 auto;scrollbar-width:none}
nav a{flex:none;font-size:14px;color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
nav a:hover{border-color:var(--c)}
section{scroll-margin-top:64px}
.sh{display:flex;align-items:baseline;gap:12px;border-top:2px solid var(--c);padding-top:12px;margin:0 0 18px}
.sh h2{margin:0;font-size:22px;font-weight:700;color:var(--c)}.sh span{color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 16px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.card canvas{width:100%;aspect-ratio:1;display:block;background:var(--plate);border-radius:6px;outline:1px solid transparent;transition:outline-color .15s}
.card:hover canvas{outline-color:var(--c)}
.card:focus-visible canvas{outline:2px solid var(--c)}
.card b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;font-weight:700;margin:8px 0 4px}
.card b small{font-size:11px;font-weight:500;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:0 7px;line-height:1.6}
.card p{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
.card p i{font-style:normal;color:var(--c);font-weight:500;margin-right:4px}
.how{margin-top:clamp(24px,3vw,40px);border-top:1px solid var(--line);padding-top:20px}
.howbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs button,.copy{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.tabs button[aria-selected=true]{border-color:var(--c);color:var(--c);font-weight:700}
.copy{font-weight:500}
.howmeta{margin:14px 0 10px;font-size:15px;line-height:1.7}
.howmeta .tag{margin-right:8px}
.how pre{margin:0;background:var(--plate);border-radius:8px;padding:16px 18px;overflow:auto;max-height:480px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2}
.how pre[hidden]{display:none}
.how pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
footer{color:var(--sub);font-size:13px}
@media(max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media(prefers-reduced-motion:reduce){.card canvas{transition:none}html{scroll-behavior:auto}}
html{scroll-behavior:smooth;scroll-padding-top:64px}
</style>
</head>
<body>
<header class="band">
<div class="top"><h1 data-u="title">ジェネラティブアート図鑑</h1><div class="lang" role="group" aria-label="Language"><button data-l="ja">日本語</button><button data-l="en">English</button><button data-l="zh">繁體中文</button></div></div>
<p class="lead" data-u="lead"></p>
<div class="hero" id="hero">
<canvas id="big" width="680" height="680"></canvas>
<div>
<span class="tag" id="hTag"></span>
<h2 id="hName"></h2>
<dl><dt data-u="look"></dt><dd id="hV"></dd><dt data-u="use"></dt><dd id="hU"></dd><dt data-u="expl"></dt><dd id="hX" style="font-size:15px;line-height:1.7"></dd></dl>
<div class="ctl" role="group" aria-label="再生"><button id="bDraw" data-u="draw"></button><button id="bMove" data-u="move"></button><button id="bStop" data-u="stop"></button></div>
<p class="mvnote" id="hM" aria-live="polite"></p>
<div class="ctl"><button id="prev" data-u="prev"></button><button id="next" data-u="next"></button><button id="rand" data-u="rand"></button></div>
</div>
</div>
<div class="how" id="how">
<div class="howbar"><div class="tabs" role="tablist" aria-label="作り方"><button role="tab" id="tE" aria-selected="true" data-u="tabE"></button><button role="tab" id="tP" aria-selected="false" data-u="tabP"></button></div><button class="copy" id="copy" data-u="copy"></button></div>
<p class="howmeta" id="howMeta"></p>
<pre id="howPre"><code id="howCode"></code></pre>
</div>
</header>
<nav id="navEl"><div class="scroll" id="nav"></div></nav>
<main class="band" id="main"></main>
<footer class="band" data-u="footer"></footer>
<script>

['シェイプレイヤーのパスに createPath() を使うエクスプレッションを設定し、形の計算はすべてエクスプレッションで行う。点の数が多いと重くなるので、点の数もスライダーで調整できるようにする。','Put an expression that uses createPath() on the shape layer’s path and do all shape calculations in the expression. Many points get slow, so make the point count adjustable with a slider too.','在形狀圖層的路徑上設定使用 createPath() 的運算式,所有形狀計算都在運算式中完成。點數太多會變慢,所以點數也要能用滑桿調整。'],
['小さなシェイプレイヤーを1つ作り、指定した数だけ複製する。各レイヤーの位置やパスは index を使ったエクスプレッションで計算し、共通のパラメータはコントローラー用ヌルレイヤーから参照する。','Create one small shape layer and duplicate it the required number of times. Compute each layer’s position or path with an expression using index, and read shared parameters from a controller null layer.','建立一個小形狀圖層並複製到指定數量。各圖層的位置或路徑用使用 index 的運算式計算,共用參數則從控制用的 Null 圖層讀取。'],
['図形の数が多く1本のパスでは表現できないため、ExtendScriptで計算してシェイプグループを生成する。パラメータを変えて作り直せるように、ScriptUIのドッキング可能なパネルにスライダー(数値入力)と[生成]ボタンを付ける。生成したシェイプは1つのシェイプレイヤーにまとめ、線と塗りは後からまとめて変えられるようにする。','There are too many shapes for a single path, so compute them in ExtendScript and generate shape groups. To rebuild with new parameters, add sliders (number inputs) and a [Generate] button to a dockable ScriptUI panel. Put the generated shapes in one shape layer so stroke and fill can be changed together afterwards.','圖形數量太多、無法用一條路徑表現,因此用 ExtendScript 計算並產生形狀群組。為了能改參數重新產生,在可停駐的 ScriptUI 面板加上滑桿(數值輸入)與[產生]按鈕。產生的形狀集中在同一個形狀圖層,之後可一起修改筆畫與填色。'],
['ピクセル単位の計算(または数十万点の描画)が必要でエクスプレッションでは重すぎるため、Pythonで透過PNGの連番を書き出す。続けてExtendScriptでその連番をAEに読み込み、アクティブなコンポに配置するところまで自動化する。色はAE側の「色合い」「グロー」などで調整できるよう、Pythonでは白一色+透明度で書き出す。','It needs per-pixel calculation (or hundreds of thousands of points), which is too heavy for expressions, so write out a transparent PNG sequence with Python. Then automate importing that sequence into AE with ExtendScript and placing it in the active comp. Export in plain white with alpha so color can be set in AE with Tint, Glow and so on.','需要逐像素計算(或繪製數十萬個點),運算式太吃力,因此用 Python 輸出透明 PNG 序列。接著用 ExtendScript 自動把序列匯入 AE 並放進目前的構圖。Python 只輸出白色+透明度,顏色在 AE 用「濃淡」「光暈」等調整。'],

['三角形が数百〜数千個に分かれるため、1本のパスでは描けません。スクリプトで三角形のシェイプを一括生成するのが確実です。手作業で作るなら、三角形1つにリピーター(コピー数3・位置ずらし)を入れ子にする方法もあります。','It splits into hundreds or thousands of triangles, so one path can’t draw it. Generating the triangles with a script is the reliable way. By hand, you can also nest Repeaters (3 copies, offset position) on a single triangle.','三角形會分成數百到數千個,無法用一條路徑畫出。用指令碼一次產生三角形最可靠。若要手動製作,也可以在一個三角形上巢狀使用重複器(複本3個、位置錯開)。'],

['数ごとに別々の線が数千本になるため、スクリプトで生成するのが確実です。線を重ねて不透明度を下げると、束の濃淡が出ます。','Each number is a separate line, thousands in total, so a script is the reliable way. Overlap them at low opacity to shade the bundle.','每個數字是一條獨立的線,共有數千條,用指令碼產生最可靠。降低不透明度疊加,線束就有濃淡。'],
['円が数千個になるため、スクリプトで楕円のシェイプを一括生成するのが確実です。円の位置と大きさは「デカルトの円定理」で計算します。','It needs thousands of circles, so generating ellipse shapes with a script is the reliable way. Positions and sizes come from Descartes’ circle theorem.','圓會有數千個,用指令碼一次產生橢圓形狀最可靠。圓的位置與大小以「笛卡兒圓定理」計算。'],
['円が数百個になるため、スクリプトで生成するのが確実です。','It needs hundreds of circles, so a script is the reliable way.','圓會有數百個,用指令碼產生最可靠。'],
['1段だけなら、楕円1つにリピーター(コピー数=円の数、回転=360÷円の数)でも作れます。入れ子にする場合はスクリプトで生成するのが確実です。','For a single ring, one ellipse with a Repeater (copies = circle count, rotation = 360 ÷ count) works. For nested rings, a script is the reliable way.','只有一層的話,一個橢圓加重複器(複本數=圓數、旋轉=360÷圓數)也能做到。要巢狀時用指令碼產生最可靠。'],
['円の配置は乱数で試行錯誤して決めるため、スクリプトで計算して楕円を生成するのが確実です。','Placement is found by random trial and error, so computing it in a script and generating ellipses is the reliable way.','圓的位置以亂數反覆嘗試決定,用指令碼計算並產生橢圓最可靠。'],
['「掛け算の円 ×2」と同じエクスプレッションで、Kを37にします。','Same expression as “Times-table circle ×2”, with K set to 37.','與「乘法圓 ×2」相同的運算式,把K設為37。'],
['画面の全ピクセルで振動の式を計算するため、外部で連番を作るのが確実です。式は cos(nπx)cos(mπy) − cos(mπx)cos(nπy) がほぼ0になる場所に点を打ちます。','The vibration formula is computed for every pixel, so making a sequence externally is the reliable way. Dots go where cos(nπx)cos(mπy) − cos(mπx)cos(nπy) is close to 0.','每個像素都要計算振動公式,在外部製作序列最可靠。在 cos(nπx)cos(mπy) − cos(mπx)cos(nπy) 接近0的位置打點。'],
['数百万の点を重ねて濃淡を出すため、外部で計算するのが確実です。点の密度を対数で明るさに変えると、煙のような質感になります。','Millions of points are layered to create shading, so computing externally is the reliable way. Mapping point density to brightness on a log scale gives a smoky texture.','需要疊加數百萬個點來呈現濃淡,在外部計算最可靠。把點的密度以對數轉為亮度,就會有煙霧般的質感。'],

['点の集まりで形が見えるタイプなので、外部で計算するのが確実です。','The shape emerges from a cloud of points, so computing externally is the reliable way.','形狀由點的集合呈現,在外部計算最可靠。'],

const EXPL={
'コッホ曲線':['スウェーデンの数学者ヘルゲ・フォン・コッホが1904年に発表しました。どこもつながっているのに、どこも角だらけで接線が引けない曲線の例です。世代ごとに長さが4/3倍になり、無限に長くなります。','Published by Swedish mathematician Helge von Koch in 1904 as a curve that is continuous everywhere yet has a tangent nowhere. Each generation multiplies its length by 4/3, so it grows infinitely long.','瑞典數學家海里格・馮・科赫於1904年發表。它處處連續、卻處處都是尖角而無法畫切線。每一代長度變為4/3倍,因此會無限延長。'],
'コッホ雪片':['周の長さは無限なのに、囲まれた面積は最初の三角形の8/5倍で止まります。フラクタル次元は約1.26で、線と面の中間の「次元」を持ちます。','Its perimeter is infinite, yet the enclosed area stops at 8/5 of the original triangle. Its fractal dimension is about 1.26, between a line and a surface.','周長無限,但圍出的面積停在原三角形的8/5倍。碎形維度約1.26,介於線與面之間。'],
'チェザロ曲線':['イタリアの数学者エルネスト・チェザロにちなむ、コッホ曲線の変種です。折れる角度を85°まで鋭くすると、出っ張りが内側に深く食い込み、密に詰まった模様になります。','A Koch-curve variant named after Italian mathematician Ernesto Cesàro. Sharpening the fold to 85° makes the spikes bite deep inward into a dense pattern.','以義大利數學家埃內斯托・切薩羅命名的科赫曲線變體。把折角銳化到85°,凸起會深深向內咬合,形成密集的圖樣。'],
'2次コッホ島':['正方形の各辺を、直角の凹凸8本に置き換えるのを繰り返します。出っ張りとへこみが同じ面積なので、面積は元の正方形のまま、周の長さだけが無限に伸びます。','Each side of a square is repeatedly replaced by eight right-angled segments. Bumps and dents have equal area, so the area stays that of the square while the perimeter grows without limit.','把正方形每一邊反覆換成8段直角凹凸。凸出與凹入面積相同,所以面積維持原正方形,只有周長無限延伸。'],
'ミンコフスキー・ソーセージ':['数学者ヘルマン・ミンコフスキーにちなみます。1本の線が1/4サイズの8本に分かれるので、フラクタル次元はちょうど1.5になります。','Named after mathematician Hermann Minkowski. Each segment becomes eight copies at 1/4 scale, so its fractal dimension is exactly 1.5.','以數學家赫爾曼・閔可夫斯基命名。每段線變成8段1/4大小的線,所以碎形維度剛好是1.5。'],
'ドラゴン曲線':['1960年代にNASAの物理学者ジョン・ハイウェイらが発見しました。紙テープを同じ向きに何度も半分に折り、開いて折り目を直角にすると現れます。小説『ジュラシック・パーク』の章扉にも使われました。','Discovered in the 1960s by NASA physicists including John Heighway. Fold a strip of paper in half repeatedly in the same direction, unfold it with every crease at 90°, and this shape appears. It decorates the chapter openings of the novel Jurassic Park.','1960年代由NASA物理學家約翰・海威等人發現。把紙條朝同一方向反覆對折,展開後讓每個摺痕成直角,就會出現這個形狀。小說《侏羅紀公園》的章節扉頁也用了它。'],
'レヴィC曲線':['フランスの数学者ポール・レヴィが1938年に研究しました。線分を、それを斜辺とする直角二等辺三角形の2辺に置き換えるのを繰り返します。ドラゴン曲線とは折る向きが違うだけの兄弟です。','Studied by French mathematician Paul Lévy in 1938. Each segment is repeatedly replaced by the two legs of the right isosceles triangle built on it. It is a sibling of the dragon curve, differing only in fold direction.','法國數學家保羅・萊維於1938年研究。把線段反覆替換成以它為斜邊的等腰直角三角形的兩股。它與龍形曲線是兄弟,只差在摺的方向。'],
'シェルピンスキーの三角形':['ポーランドの数学者ヴァツワフ・シェルピンスキーが1915年に発表しました。パスカルの三角形の奇数だけを塗っても、点をランダムに打つ「カオスゲーム」でも同じ模様が現れます。','Published by Polish mathematician Wacław Sierpiński in 1915. The same pattern appears if you color the odd numbers of Pascal’s triangle, or plot random points with the “chaos game.”','波蘭數學家瓦茨瓦夫・謝爾賓斯基於1915年發表。只塗帕斯卡三角形的奇數,或用隨機打點的「混沌遊戲」,都會出現同樣的圖樣。'],
'シェルピンスキーの矢じり':['1本の線を折り曲げるだけで、世代を上げるほどシェルピンスキーの三角形に近づきます。トリムパスで描くと、三角形が一筆で埋まっていく様子が見せられます。','Just by bending one line, it approaches the Sierpiński triangle as generations increase. With Trim Paths you can show the triangle being filled in a single stroke.','只靠折彎一條線,世代越高就越接近謝爾賓斯基三角形。用修剪路徑描繪,就能呈現三角形被一筆填滿的過程。'],
'シェルピンスキーのカーペット':['シェルピンスキーが1916年に発表しました。繰り返すほど面積は0に近づきますが、平面上のどんな曲線もこの図形の中に描けるという不思議な性質があります。','Published by Sierpiński in 1916. Its area tends to zero, yet any curve in the plane can be drawn inside it, a strange property called universality.','謝爾賓斯基於1916年發表。重複越多面積越接近0,但平面上任何曲線都能畫在其中,具有奇妙的「普適性」。'],
'ヴィチェック・フラクタル':['ハンガリーの物理学者タマーシュ・ヴィチェックにちなみます。正方形を9分割して十字の5マスだけ残すのを繰り返し、次元は約1.465です。','Named after Hungarian physicist Tamás Vicsek. Split a square into nine and keep only the five forming a cross, again and again. Its dimension is about 1.465.','以匈牙利物理學家塔馬什・維切克命名。把正方形九等分、只留下十字的5格,反覆進行,維度約1.465。'],
'T-スクエア':['正方形の4つの角に、半分の大きさの正方形を置き続けます。極限では元の正方形の範囲をすき間なく埋め、フラクタル次元は2になります。','Keep placing half-size squares on the four corners. In the limit it fills its bounding square completely, with a fractal dimension of 2.','不斷在四個角放上一半大小的正方形。極限時會毫無空隙地填滿外框,碎形維度為2。'],
'カントール集合':['ゲオルク・カントールが1883年に紹介しました。線分の真ん中1/3を取り除き続けると、長さの合計は0になるのに、残る点は実数と同じだけ(数えきれないほど)あります。','Introduced by Georg Cantor in 1883. Keep removing the middle third and the total length becomes zero, yet as many points remain as there are real numbers.','格奧爾格・康托爾於1883年提出。不斷移除中間1/3,總長度變成0,但剩下的點和實數一樣多(不可數)。'],
'ヒルベルト曲線':['ダフィット・ヒルベルトが1891年に発表した「空間充填曲線」です。1次元の線で2次元の面を埋め尽くします。近い点が線の上でも近くに並ぶので、画像処理やデータベースの索引に使われます。','A space-filling curve published by David Hilbert in 1891: a 1-D line that fills a 2-D square. Nearby points stay close along the line, so it is used in image processing and database indexing.','大衛・希爾伯特於1891年發表的「空間填充曲線」,用一維的線填滿二維的面。相近的點在線上也相近,因此用於影像處理與資料庫索引。'],
'ペアノ曲線':['ジュゼッペ・ペアノが1890年に発見した、最初の空間充填曲線です。「線が面を埋め尽くせる」という発見は、当時の数学者を大いに驚かせました。','The first space-filling curve, found by Giuseppe Peano in 1890. The idea that a line could fill an area astonished mathematicians of the time.','朱塞佩・皮亞諾於1890年發現的第一條空間填充曲線。「線能填滿面」的發現,讓當時的數學家大為震驚。'],
'ムーア曲線':['E・H・ムーアが1900年に発表した、ヒルベルト曲線の変種です。始点と終点が隣り合うので、ループ素材として切れ目なくつなげられます。','A Hilbert-curve variant published by E. H. Moore in 1900. Its start and end are adjacent, so it loops seamlessly.','E・H・摩爾於1900年發表的希爾伯特曲線變體。起點與終點相鄰,可做成無縫循環素材。'],
'シェルピンスキー曲線':['シェルピンスキーが1912年に発表した、閉じた空間充填曲線です。斜め45°の線だけで正方形を埋めます。','A closed space-filling curve published by Sierpiński in 1912, filling a square using only 45° lines.','謝爾賓斯基於1912年發表的封閉空間填充曲線,只用45°斜線填滿正方形。'],
'ゴスパー曲線':['プログラマーのビル・ゴスパーが1970年代に考案し、「フロースネーク」とも呼ばれます。六角形の格子を埋め、全体の輪郭は雪片のような「ゴスパー島」になります。','Devised by programmer Bill Gosper in the 1970s and also called the flowsnake. It fills a hexagonal grid, and its outline forms the snowflake-like “Gosper island.”','由程式設計師比爾・高斯帕於1970年代設計,又稱「流蛇(flowsnake)」。它填滿六角格子,整體輪廓是雪花般的「高斯帕島」。'],
'Zオーダー曲線':['座標の2進数のビットを交互に並べた順番(モートン順序)です。近い位置のデータをメモリ上でも近くに置けるため、GPUのテクスチャやデータベースで使われています。','The order you get by interleaving the binary bits of the coordinates (Morton order). It keeps nearby data close in memory, so GPUs and databases use it.','把座標的二進位位元交錯排列的順序(莫頓序)。能讓位置相近的資料在記憶體中也相近,因此用於GPU材質與資料庫。'],
'L-system(植物)':['生物学者アリステッド・リンデンマイヤーが1968年、藻類の成長を記述するために考案しました。文字を置き換えるルールだけで、本物そっくりの草木が育ちます。','Devised in 1968 by biologist Aristid Lindenmayer to describe algae growth. Simple character-replacement rules grow strikingly realistic plants.','生物學家阿利斯蒂德・林登麥伊爾於1968年為描述藻類生長而設計。只靠替換字元的規則,就能長出逼真的草木。'],
'フラクタルツリー':['枝を一定の比率と角度で二股に分け続ける、いちばん基本的な再帰図形です。比率と角度を変えるだけで、シダ・ブロッコリー・稲妻のように印象が変わります。','The most basic recursive figure: keep forking each branch at a fixed ratio and angle. Changing just those two values turns it into a fern, broccoli or lightning.','最基本的遞迴圖形:以固定比例與角度不斷分岔。只要改變比例與角度,就能變成蕨類、花椰菜或閃電。'],
'ピタゴラスの木':['オランダの数学教師アルベルト・ボスマンが1942年に考案しました。三平方の定理の図(直角三角形の各辺に正方形)を、どこまでも積み重ねています。','Devised by Dutch math teacher Albert Bosman in 1942. It stacks the Pythagorean-theorem diagram, squares on the sides of a right triangle, endlessly.','荷蘭數學老師亞伯特・博斯曼於1942年設計。把畢氏定理的圖(直角三角形各邊上的正方形)無限堆疊。'],
'非対称ピタゴラスの木':['直角三角形の角度を45°以外にすると、片側の枝ばかりが大きくなり、カールしながら巻き込む形になります。角度を動かすと、風に揺れるような動きが出ます。','With an angle other than 45°, one side’s branches grow larger and the tree curls over. Animating the angle makes it sway as if in the wind.','直角三角形的角度不是45°時,一側的枝條會越長越大,形成捲曲的樣子。讓角度變化,就會像隨風搖曳。'],
'H-ツリー':['長さを1/√2ずつ縮めながらH字を重ねます。中心からどの端点までも同じ距離で届くため、半導体チップのクロック配線に使われています。','H shapes are nested while shrinking by 1/√2. Every endpoint is the same distance from the center, so it is used for clock wiring on chips.','以1/√2的比例縮小並疊加H字。從中心到每個端點距離都相同,因此用於晶片的時脈佈線。'],
'コラッツの木':['「偶数なら2で割り、奇数なら3倍して1を足す」を繰り返すと必ず1になるか、という未解決問題(コラッツ予想、1937年)が元です。1までの道のりを偶数と奇数で逆に曲げると、海藻のような形になります。','Based on the unsolved Collatz conjecture (1937): halve even numbers, triple odd ones and add 1; do you always reach 1? Bending each path to 1 one way for even and the other for odd makes a seaweed-like shape.','源自未解問題「考拉茲猜想」(1937年):偶數除以2、奇數乘3加1,是否一定會回到1?把到1的路徑依偶數與奇數往相反方向彎曲,就會形成海藻般的形狀。'],
'アポロニウスのギャスケット':['古代ギリシャのアポロニウスが考えた「3つの円に接する円を求める問題」が元です。円の曲率(半径の逆数)はデカルトの円定理で計算でき、この配置ではすべて整数になります。','Rooted in Apollonius of Perga’s ancient problem of finding circles tangent to three others. Curvatures (1/radius) follow Descartes’ circle theorem, and in this layout every one is an integer.','源自古希臘阿波羅尼斯「求與三個圓相切之圓」的問題。圓的曲率(半徑倒數)可用笛卡兒圓定理計算,在這個配置中全都是整數。'],
'フォードの円':['レスター・フォードが1938年に発表しました。分数p/qの上に半径1/(2q²)の円を置くと、どの円も重ならず、接するだけになります。','Published by Lester Ford in 1938. Place a circle of radius 1/(2q²) above each fraction p/q, and no two circles ever overlap. They only touch.','萊斯特・福特於1938年發表。在每個分數p/q上方放一個半徑1/(2q²)的圓,任兩個圓都不會重疊,只會相切。'],
'シュタイナーの円鎖':['スイスの数学者ヤコブ・シュタイナーにちなみます。鎖が一周してぴったり閉じるなら、最初の円をどこに置いても必ず閉じる、という不思議な定理(ポリズム)があります。','Named after Swiss mathematician Jakob Steiner. His porism says that if the chain closes once, it closes no matter where you place the first circle.','以瑞士數學家雅各布・斯坦納命名。他的「不定性定理」指出:若圓鏈能剛好繞一圈閉合,那麼第一個圓放在哪裡都一定會閉合。'],
'サークルパッキング':['円を重ならないように詰めていく、ジェネラティブアートの定番です。ランダムな位置を試して、入る最大の大きさを探すのを繰り返します。','A generative-art staple: pack circles without overlap. Try random positions and find the largest circle that fits, over and over.','生成藝術的經典手法:不重疊地塞入圓。反覆嘗試隨機位置,找出能放入的最大圓。'],
'スピログラフ':['1965年にイギリスの技術者デニス・フィッシャーが発売した玩具で有名になりました。円の内側を歯車が転がり、ペン先が「ハイポトロコイド」という曲線を描きます。','Made famous by the toy launched by British engineer Denys Fisher in 1965. A gear rolls inside a ring and the pen traces a hypotrochoid.','因英國工程師丹尼斯・費雪於1965年推出的玩具而聞名。齒輪在圓環內滾動,筆尖畫出名為「內旋輪線」的曲線。'],
'エピサイクロイド':['円の外側を別の円が転がるとき、周上の1点が描く軌跡です。2つの円の半径の比が整数なら、その数だけ尖りができます。','The path of a point on a circle rolling around the outside of another. When the radius ratio is an integer, you get that many cusps.','一個圓在另一個圓外側滾動時,圓周上一點的軌跡。兩圓半徑比為整數時,就會有那麼多個尖角。'],
'カージオイド':['「心臓形」という意味で、同じ大きさの円どうしで描くエピサイクロイドです。円周上の一点から光を当てたときに、円形の鏡で反射した光が集まる形(コースティクス)もカージオイドになります。','Meaning “heart-shaped,” it is the epicycloid of two equal circles. Light from a point on a circular mirror reflects into this same caustic shape.','意思是「心臟形」,是兩個等大圓畫出的外擺線。從圓周上一點發光、經圓形鏡反射所聚成的焦散也是心臟線。'],
'ネフロイド':['「腎臓形」という意味です。平行な光が円形の鏡で反射して集まる形(コースティクス)がネフロイドになり、日なたに置いたコーヒーカップの中にも見えます。','Meaning “kidney-shaped.” Parallel light reflected off a circular mirror gathers into a nephroid, which you can see inside a coffee cup in sunlight.','意思是「腎臟形」。平行光經圓形鏡反射聚成的焦散就是腎臟線,在陽光下的咖啡杯裡也看得到。'],
'デルトイド':['3倍の大きさの円の内側を転がる円で描く曲線です。ギリシャ文字のΔ(デルタ)に似ていることから名付けられ、オイラーが1745年に研究しました。','Traced by a circle rolling inside one three times larger. Named for its resemblance to the Greek letter Δ, it was studied by Euler in 1745.','由在三倍大的圓內滾動的圓所畫出。因形似希臘字母Δ而得名,歐拉於1745年研究過。'],
'アステロイド':['4倍の大きさの円の内側を転がる円で描く曲線です。壁に立てかけたはしごが滑り落ちるとき、はしごが通る範囲の境界もこの形になります。','Traced by a circle rolling inside one four times larger. The boundary swept by a ladder sliding down a wall has this same shape.','由在四倍大的圓內滾動的圓所畫出。靠在牆上的梯子滑落時,梯子掃過範圍的邊界也是這個形狀。'],
'マウラーのバラ':['ピーター・マウラーが1987年に発表しました。ローズ曲線の上を一定の角度ずつ飛びながら直線で結ぶと、繊細な網目の花が浮かびます。','Introduced by Peter Maurer in 1987. Hop around a rose curve by a fixed angle, joining the points with straight lines, and a delicate mesh flower appears.','彼得・莫勒於1987年發表。沿著玫瑰線以固定角度跳躍並以直線相連,就會浮現細緻的網狀花朵。'],
'ギョーシェ模様':['紙幣・パスポート・高級時計の文字盤に使われる装飾技法です。もとは「ローズエンジン」という機械式の旋盤で彫っていました。線が細かすぎて複製しにくいため、偽造防止にも役立ちます。','A decorative technique used on banknotes, passports and fine watch dials, originally cut on a mechanical “rose engine” lathe. The lines are too fine to copy easily, which also helps prevent forgery.','用於鈔票、護照與高級錶面的裝飾技法,原本以名為「玫瑰引擎」的機械車床雕刻。線條細到難以複製,也有助於防偽。'],
'リサジュー曲線':['フランスの物理学者ジュール・アントワーヌ・リサジューが1857年、音叉の振動を光で可視化して研究しました。オシロスコープでおなじみの図形です。','Studied in 1857 by French physicist Jules Antoine Lissajous, who made tuning-fork vibrations visible with light. A familiar sight on oscilloscopes.','法國物理學家朱爾・安托萬・李薩如於1857年用光將音叉振動可視化並加以研究。是示波器上常見的圖形。'],
'3Dリサジュー':['x・y・zの3方向に、それぞれ違う周波数の波を割り当てます。3つの周波数がどの2つも互いに素なら、結び目のような1本の閉じた曲線(リサジュー結び目)になります。','Assign a different frequency wave to each of x, y and z. When every pair of frequencies is coprime, you get a single closed knotted curve, a Lissajous knot.','為x、y、z三個方向分別指定不同頻率的波。三個頻率兩兩互質時,會形成一條閉合打結的曲線(李薩如紐結)。'],
'ハーモノグラフ':['19世紀半ばに登場した、振り子にペンを付けて模様を描く装置です。摩擦で揺れがだんだん小さくなるので、模様は渦を巻きながら中心へ向かいます。','A mid-19th-century device that draws patterns with pens attached to pendulums. Friction slowly shrinks the swing, so the pattern spirals toward the center.','19世紀中葉出現、把筆裝在擺上畫圖的裝置。摩擦讓擺幅逐漸變小,圖樣便盤旋著朝中心收攏。'],
'二重振り子':['振り子の先にもう1つ振り子をつないだだけで、動きが予測できなくなります。初期角度がほんのわずか違うだけで、まったく別の軌跡になるカオスの代表例です。','Attach one pendulum to the end of another and the motion becomes unpredictable. A tiny change in starting angle produces a completely different path, a classic example of chaos.','只是在擺的末端再接一個擺,運動就變得無法預測。初始角度稍有不同,軌跡就完全不同,是混沌的代表例子。'],
'バラ曲線':['イタリアの数学者グイド・グランディが1720年代に研究しました。r = cos(kθ) で、kが整数なら奇数のときk枚、偶数のとき2k枚の花びらになります。','Studied by Italian mathematician Guido Grandi in the 1720s. For r = cos(kθ) with integer k, you get k petals when k is odd and 2k when it is even.','義大利數學家圭多・格蘭迪於1720年代研究。r = cos(kθ) 中,k為整數時,奇數有k片花瓣、偶數有2k片。'],
'スーパーフォーミュラ':['ベルギーの植物学者ヨハン・ゲリスが2003年に発表しました。1つの式のパラメータを変えるだけで、ヒトデ・花・多角形など自然界の多くの形を表せます。','Published by Belgian botanist Johan Gielis in 2003. Changing the parameters of one formula produces starfish, flowers, polygons and many other natural forms.','比利時植物學家約翰・吉利斯於2003年發表。只要改變一個公式的參數,就能表現海星、花朵、多邊形等許多自然形狀。'],
'スーパー楕円':['フランスの数学者ガブリエル・ラメが19世紀に研究した曲線(ラメ曲線)です。デンマークのピート・ハインが広場や家具のデザインに使い、角丸アイコンの「スクワークル」もこの仲間です。','A curve studied by French mathematician Gabriel Lamé in the 19th century. Danish designer Piet Hein used it for plazas and furniture, and rounded “squircle” icons belong to the same family.','法國數學家加布里埃爾・拉梅於19世紀研究的曲線(拉梅曲線)。丹麥的皮特・海恩將它用於廣場與家具設計,圓角圖示的「方圓形」也屬於同一家族。'],
'バタフライ曲線':['テンプル・フェイが1989年に発表した極座標の曲線です。指数関数と三角関数を組み合わせるだけで、蝶の羽のような形が現れます。','A polar curve published by Temple Fay in 1989. Combining an exponential with trigonometric functions produces a butterfly-wing shape.','坦普・費伊於1989年發表的極座標曲線。只是組合指數函數與三角函數,就會出現蝴蝶翅膀的形狀。'],
'ハート曲線':['定番の「ハートの方程式」の1つです。sinの3乗で横の丸みを、いくつかのcosの和で上のくぼみと下の尖りを作っています。','One of the classic heart equations. The cube of sin shapes the rounded sides, and a sum of cosines creates the top dip and bottom point.','經典的「愛心方程式」之一。以sin的三次方做出兩側的圓弧,以幾個cos的和做出上方凹陷與下方尖端。'],
'トーラス結び目':['ドーナツ(トーラス)の表面を、穴の周りにp回、チューブの周りにq回巻きつく曲線です。pとqが互いに素なら1本の結び目になり、(2,3)はおなじみの三つ葉結び目です。','A curve that winds p times around a doughnut’s hole and q times around its tube. When p and q are coprime it forms a single knot; (2,3) is the familiar trefoil.','在甜甜圈(環面)表面,繞孔洞p圈、繞管身q圈的曲線。p與q互質時會形成一個紐結,(2,3)就是常見的三葉結。'],
'フィロタキシス':['植物の葉や種の並び方のことです。ひまわりは約137.5°の「黄金角」ずつ回して種を置くことで、すき間なく詰めています。見える渦の本数は、34や55などのフィボナッチ数になります。','The arrangement of leaves and seeds in plants. Sunflowers place each seed about 137.5° (the golden angle) from the last, packing them without gaps. The visible spirals come in Fibonacci numbers such as 34 and 55.','指植物葉片與種子的排列方式。向日葵每顆種子旋轉約137.5°(黃金角)擺放,因而毫無空隙。看得到的螺臂數量是34、55等費波那契數。'],
'対数らせん(黄金)':['ヤコブ・ベルヌーイが「驚異のらせん」と呼んだ曲線です。どこを拡大しても同じ形(自己相似)で、オウムガイの殻、台風、銀河の腕に近い形をしています。90°ごとに黄金比で広がるものを黄金らせんと呼びます。','The curve Jacob Bernoulli called the “marvelous spiral.” It looks the same at every scale and resembles nautilus shells, hurricanes and galaxy arms. When it widens by the golden ratio every 90°, it is called the golden spiral.','雅各布・白努利稱之為「神奇的螺線」。無論放大哪裡形狀都相同(自相似),近似鸚鵡螺殼、颱風與星系旋臂。每90°以黃金比擴展者稱為黃金螺線。'],
'アルキメデスらせん':['アルキメデスが紀元前225年ごろ『らせんについて』で研究しました。回転とともに一定の速さで外へ広がるので、巻きの間隔が等しくなります。レコードの溝やゼンマイに近い形です。','Studied by Archimedes around 225 BC in On Spirals. It moves outward at a constant rate as it turns, so the turns are evenly spaced, like a record groove or a coiled spring.','阿基米德約於西元前225年在《論螺線》中研究。隨著旋轉以等速向外擴展,所以圈距相等,形狀接近唱片溝槽或發條。'],
'フェルマーらせん':['r² = θ で表されるらせんで、1636年にフェルマーが研究しました。外へ行くほど巻きの間隔が詰まります。点を黄金角で並べるフィロタキシスのモデルにも使われています。','The spiral r² = θ, studied by Fermat in 1636. Its turns get closer together farther out. It is also the model behind phyllotaxis, where points sit at the golden angle.','以 r² = θ 表示的螺線,費馬於1636年研究。越往外圈距越緊密。以黃金角排列點的葉序模型也使用它。'],
'リチュウス':['r² = 1/θ で表される曲線で、ロジャー・コーツが1722年に名付けました。ラテン語で「占い師の杖」という意味で、先が渦巻いた杖やバイオリンの渦巻きに似ています。','The curve r² = 1/θ, named by Roger Cotes in 1722. Latin for an augur’s curved staff, it resembles a crozier or the scroll of a violin.','以 r² = 1/θ 表示的曲線,羅傑・寇茲於1722年命名。拉丁文意為「占卜師的手杖」,形似頂端捲曲的手杖或小提琴的琴頭渦卷。'],
'オイラーらせん':['進むほど一定の割合で曲がり方が強くなる曲線で、クロソイドとも呼ばれます。ハンドルを一定の速さで切るのと同じなので、道路や線路のカーブに使われています。','A curve whose curvature increases steadily with length, also called a clothoid. It matches turning a steering wheel at a constant rate, so roads and railways use it for curves.','曲率隨行進距離等比增強的曲線,又稱回旋曲線。等同以固定速度轉動方向盤,因此用於道路與鐵路的彎道。'],
'掛け算の円 ×2':['円周上に点を並べ、i番目の点から i×2 番目の点へ線を引きます。掛ける数が2ならカージオイド、3ならネフロイドが浮かび上がります。YouTubeチャンネル「Mathologer」の動画で広く知られるようになりました。','Place points around a circle and join point i to point i×2. A multiplier of 2 reveals a cardioid, 3 a nephroid. It became widely known through the YouTube channel Mathologer.','在圓周上排列點,把第i個點連到第i×2個點。乘數為2時浮現心臟線,為3時浮現腎臟線。因YouTube頻道「Mathologer」的影片而廣為人知。'],
'掛け算の円 ×37':['掛ける数が大きくなると、線の重なりから複雑な花や星の網目が現れます。数を少し変えるだけで模様ががらりと変わるので、アニメーション向きです。','With larger multipliers, complex flower and star meshes emerge from the overlapping lines. A small change in the number transforms the pattern, which makes it great to animate.','乘數變大時,線條交疊會出現複雜的花朵與星形網紋。數字稍一改變圖樣就大不相同,很適合做動畫。'],
'ストリングアート':['直線だけで曲線の輪郭(包絡線)を浮かび上がらせる技法です。19世紀にメアリー・エベレスト・ブールが、子どもに幾何を教えるために考えた「カーブステッチ」が始まりとされます。','A technique where straight lines alone reveal a curve (their envelope). It is traced to the “curve stitching” Mary Everest Boole devised in the 19th century to teach children geometry.','只用直線就浮現曲線輪廓(包絡線)的技法。一般認為源自19世紀瑪麗・埃佛勒斯・布爾為教孩子幾何而設計的「曲線縫」。'],
'追跡曲線(4匹の虫)':['正方形の角にいる4匹の虫が、それぞれ隣の虫に向かって同時に歩くと、全員がらせんを描いて中心で出会います。古くから知られる「ネズミの問題」です。','Four bugs at the corners of a square each walk toward their neighbor at the same time. All of them spiral in and meet at the center: the long-known “mice problem.”','站在正方形四角的四隻蟲同時朝鄰居走去,全員會畫著螺線在中心相遇。這是早已知名的「老鼠問題」。'],
'スターポリゴン {17/7}':['n個の点をm個ずつ飛ばして結ぶ星形で、{n/m} と書きます。nとmが互いに素なら一筆書きでつながり、{5/2} がおなじみの五芒星です。','A star made by joining every m-th of n points, written {n/m}. When n and m are coprime it is drawn in one stroke; {5/2} is the familiar pentagram.','把n個點每隔m個相連而成的星形,記作{n/m}。n與m互質時可一筆畫完,{5/2}就是常見的五芒星。'],
'フーリエ級数(エピサイクル)':['どんな閉じた形も、違う速さで回る円の組み合わせで描けます(フーリエ級数)。古代の天文学で惑星の動きを説明した「周転円」と同じ考え方です。','Any closed shape can be drawn by circles spinning at different speeds (a Fourier series). It is the same idea as the epicycles ancient astronomers used to explain planetary motion.','任何封閉形狀都能用以不同速度旋轉的圓組合畫出(傅立葉級數)。這與古代天文學用來解釋行星運動的「本輪」是同一個想法。'],
'矩形波のフーリエ合成':['1倍・3倍・5倍…と奇数倍の周波数のサイン波を、1、1/3、1/5…の振幅で重ねると四角い波に近づきます。角に残る小さな波打ちは「ギブス現象」と呼ばれ、いくら重ねても消えません。','Adding sine waves at 1×, 3×, 5×… the frequency with amplitudes 1, 1/3, 1/5… approaches a square wave. The small ripple left at each corner is the Gibbs phenomenon, and it never fully disappears.','把1倍、3倍、5倍…等奇數倍頻率的正弦波,以1、1/3、1/5…的振幅疊加,就會接近方波。角落殘留的小波紋稱為「吉布斯現象」,怎麼疊加都不會消失。'],
'クラドニ図形':['ドイツの物理学者エルンスト・クラドニが1787年に発表しました。砂をまいた金属板を弓でこすると、振動しない場所(節)に砂が集まって模様ができます。','Published by German physicist Ernst Chladni in 1787. Bow a metal plate sprinkled with sand and the sand gathers along the still lines (nodes), forming patterns.','德國物理學家恩斯特・克拉德尼於1787年發表。用琴弓摩擦撒了沙的金屬板,沙子會聚集在不振動的節線上,形成圖樣。'],
'ローレンツ・アトラクター':['気象学者エドワード・ローレンツが1963年、大気の対流を単純化した式から発見しました。「バタフライ効果」という言葉の由来にもなった、カオスの代表例です。','Discovered in 1963 by meteorologist Edward Lorenz in simplified equations for atmospheric convection. The classic example of chaos and the origin of the phrase “butterfly effect.”','氣象學家愛德華・勞倫茲於1963年,從簡化的大氣對流方程式中發現。是混沌的代表例子,也是「蝴蝶效應」一詞的由來。'],
'クリフォード・アトラクター':['科学作家クリフォード・ピックオーバーにちなむ2次元の写像です。sinとcosだけの式を数百万回繰り返し、点が多く集まる場所を明るくすると、煙や布のような形が現れます。','A 2-D map named after science writer Clifford Pickover. Iterate a formula of only sines and cosines millions of times, brighten where points pile up, and smoke- or cloth-like forms appear.','以科學作家克利福德・皮寇弗命名的二維映射。把只有sin與cos的式子迭代數百萬次,讓點聚集處變亮,就會出現煙霧或布料般的形狀。'],
'de Jong アトラクター':['ピーター・デ・ヨングの名がついた2次元の写像です。4つの係数を少し変えるだけで、形が劇的に変わります。','A 2-D map bearing Peter de Jong’s name. Small changes to its four coefficients transform the shape dramatically.','以彼得・德容命名的二維映射。四個係數稍一改變,形狀就劇烈變化。'],
'レスラー・アトラクター':['ドイツの生化学者オットー・レスラーが1976年に考案しました。ローレンツよりさらに単純な式でも、カオスが生まれることを示しました。','Devised by German biochemist Otto Rössler in 1976, showing that chaos can arise from equations even simpler than Lorenz’s.','德國生物化學家奧托・若斯樂於1976年設計,證明比勞倫茲更簡單的式子也能產生混沌。'],
'Aizawa アトラクター':['日本の研究者・相澤洋二の名にちなむとされるアトラクターです。球の表面を回りながら、中心の筒を通って上下に抜けていきます。','An attractor generally credited to Japanese researcher Yoji Aizawa. The orbit circles the surface of a sphere and escapes up and down through a central tube.','一般認為以日本研究者相澤洋二命名的吸引子。軌道沿著球面繞行,再穿過中央的管子上下竄出。'],
'エノン写像':['フランスの天文学者ミシェル・エノンが1976年、ローレンツ・アトラクターを単純化した2次元の写像として発表しました。拡大すると、1本に見える線が何重にも分かれています。','Published in 1976 by French astronomer Michel Hénon as a 2-D simplification of the Lorenz attractor. Zoom in and each seemingly single line splits into many.','法國天文學家米歇爾・埃農於1976年發表,作為勞倫茲吸引子的二維簡化。放大後,看似一條的線其實分成好多層。'],
'池田写像':['池田研介が1979年、レーザー光が共振器の中を回る様子のモデルとして提案した写像です。係数uを上げると渦が育ち、0.9を超えると1点に収束します。','Proposed by Kensuke Ikeda in 1979 as a model of light circulating in an optical resonator. Raising u grows the swirl; above about 0.9 it collapses to a single point.','池田研介於1979年提出,作為光在共振腔中循環的模型。提高係數u漩渦會長大,超過約0.9則收斂成一點。'],
'ティンカーベル写像':['由来ははっきりしませんが、点が飛び回った跡が妖精の飛跡のように見えることから、この名で呼ばれている2次元のカオス写像です。','A 2-D chaotic map of uncertain origin, named because the trail of its points looks like a flying fairy’s path.','名稱由來不明的二維混沌映射,因點的飛行軌跡看起來像小精靈飛過的痕跡而得名。'],
'標準写像':['ボリス・チリコフらが研究した、周期的に「蹴られる」回転体のモデルです。Kが小さいと規則的な波の帯ができ、K≈0.97で最後の帯が壊れ、それより大きいとカオスの海が広がります。','A model of a periodically kicked rotor studied by Boris Chirikov and others. Small K gives orderly bands; around K ≈ 0.97 the last band breaks, and beyond that a chaotic sea spreads.','鮑里斯・奇里科夫等人研究、週期性被「踢」的旋轉體模型。K小時形成規則的波帶,K≈0.97時最後一條帶破裂,更大時混沌之海擴散。'],
'ロジスティック写像の分岐図':['生物学者ロバート・メイが1976年に広めた、個体数の増減を表す式 x → rx(1−x) です。rを上げると周期が2、4、8…と倍々に分かれ、約3.57からカオスになります。','The population model x → rx(1−x), popularized by biologist Robert May in 1976. As r rises the cycle splits into 2, 4, 8… and turns chaotic at about 3.57.','生物學家羅伯特・梅於1976年推廣、描述族群增減的式子 x → rx(1−x)。r增加時週期依2、4、8…倍增分岔,約3.57起進入混沌。'],
'マンデルブロ集合':['ブノワ・マンデルブロが1980年ごろ、コンピューターで描いて広めました。z → z² + c を繰り返しても発散しない c の集まりで、縁をどこまで拡大しても新しい模様が現れます。','Brought to fame by Benoit Mandelbrot around 1980 using computer graphics. It is the set of c for which z → z² + c never escapes, and its edge reveals new detail at every zoom.','本華・曼德博於1980年左右以電腦繪製而推廣。它是反覆 z → z² + c 也不會發散的c之集合,邊緣無論放大多少都會出現新的圖樣。'],
'ジュリア集合':['ガストン・ジュリアが1918年に研究しました。マンデルブロ集合と同じ式で c を固定し、z の初期値を動かします。c がマンデルブロ集合の内側ならつながった形、外側なら塵のような形になります。','Studied by Gaston Julia in 1918. Same formula as the Mandelbrot set, but c is fixed and the starting z varies. If c lies inside the Mandelbrot set the shape is connected; outside, it is dust.','加斯東・朱利亞於1918年研究。使用與曼德博集合相同的式子,但固定c、改變z的初始值。c在曼德博集合內時形狀相連,在外則如塵埃散落。'],
'バーニングシップ':['1992年にミヒャエル・ミヒェリッチとオットー・レスラーが発表した、マンデルブロ集合の変種です。計算の途中で絶対値を取るだけで、燃える船のような姿が現れます。','A Mandelbrot variant published in 1992 by Michael Michelitsch and Otto Rössler. Simply taking absolute values during the calculation reveals a burning ship.','1992年由米夏埃爾・米赫利奇與奧托・若斯樂發表的曼德博集合變體。只在計算中取絕對值,就會出現燃燒中的船。'],
'ニュートン・フラクタル':['方程式の解に近づく計算法(ニュートン法)で、どの解にたどり着くかによって色分けしたものです。z³ − 1 = 0 の3つの解の境界では、どこを拡大しても3色すべてが接しています。','Color each starting point by which root Newton’s method converges to. On the borders between the three roots of z³ − 1 = 0, all three colors meet at every scale.','以求方程式解的牛頓法,依起點最後收斂到哪個根來上色。在 z³ − 1 = 0 三個根的邊界上,無論放大哪裡,三種顏色都相接。'],
'等高線':['地図の等高線と同じく、同じ高さの点を結んだ線です。高さを表す関数を少しずつ動かすと、線が生き物のようにうねります。計算には「マーチングスクエア法」を使います。','Like contour lines on a map, they join points of equal height. Shift the height function slowly and the lines writhe like living things. They are computed with marching squares.','與地圖上的等高線相同,連接同高度的點。讓表示高度的函數緩慢變化,線條就會像生物般蠕動。計算使用「行進方塊法」。'],
'ウラムのらせん':['数学者スタニスワフ・ウラムが1963年、退屈な講演中の落書きで発見したと言われます。数をらせん状に並べて素数に印を付けると、なぜか斜めの線が浮かび上がります。','Mathematician Stanisław Ulam reportedly found it in 1963 while doodling during a dull talk. Write numbers in a spiral, mark the primes, and diagonal lines mysteriously appear.','據說數學家斯塔尼斯瓦夫・烏拉姆於1963年在一場無聊的演講中塗鴉時發現。把數字排成螺旋並標出質數,不知為何會浮現斜線。'],
'レカマン数列':['コロンビアの数学者ベルナルド・レカマンにちなむ数列です。「前の数からnを引く(正の数で、まだ出ていなければ)、だめならnを足す」を繰り返します。半円で結ぶ描き方は、YouTubeの「Numberphile」で有名になりました。','A sequence named after Colombian mathematician Bernardo Recamán: subtract n from the previous term if the result is positive and new, otherwise add n. Drawing it with semicircles became famous through Numberphile on YouTube.','以哥倫比亞數學家貝爾納多・雷卡曼命名的數列:若前一項減n為正且未出現過就減,否則加n。以半圓連接的畫法因YouTube頻道「Numberphile」而出名。'],
'パスカルの三角形 mod 5':['パスカルの三角形の各数を5で割った余りで色分けすると、5分割の自己相似模様が現れます。2で割ればシェルピンスキーの三角形そのものになります。','Color Pascal’s triangle by each number’s remainder mod 5 and a five-fold self-similar pattern appears. Mod 2, it becomes the Sierpiński triangle itself.','把帕斯卡三角形的每個數以除以5的餘數上色,就會出現五分割的自相似圖樣。除以2時,就是謝爾賓斯基三角形本身。']
};

ja:{intro:n=>`After Effects用に、ジェネラティブアート「${n}」を作るツールを作ってください。`,want:'## 作りたいもの',look:'- 見た目: ',use:'- 映像での使い道: ',bg:'- 背景: ',how:'## 作り方',ref:'- 参考に、形を作るエクスプレッションの例を下に付けます。これをもとに、コントローラーとセットで自動生成してください。',pExt:'## パラメータ(Pythonスクリプトの引数で指定できるように)',pCtl:'## コントローラー(AE上で数値を動かして調整できるように)',par:(q)=>`- ${q[0]}: ${q[2]}(初期値 ${q[1]}${q[3]?'、範囲 '+q[3]:''})`,stroke:'- 線の色・線幅・塗り・不透明度は、シェイプの「線」「塗り」から変えられるようにする',anim:'## アニメーション',mv:d=>`- ${d}。該当するパラメータにキーフレームを打つか、time を使うエクスプレッションで動かせるようにし、サンプルとして5秒のループを1つ設定しておく`,trim:'- 線を描いていく動きを付けられるよう、トリムパスを追加しておく(初期状態は終了100%)',extA:'- 時間で変化させるパラメータがある場合は、フレームごとに値を補間して連番に反映する',req:'## 要件',ae:'- After Effects 2024以降、エクスプレッションエンジンはJavaScript',py:['- Python 3 + numpy + Pillow を使用。必要なライブラリは requirements.txt にまとめる','- 書き出し先フォルダ、解像度(初期値1920×1080)、フレーム数を引数で指定できるようにする','- 書き出した連番をAEに読み込むExtendScript(.jsx)も作り、フレームレートを指定してアクティブなコンポに配置する','- 計算が重いので、進捗をターミナルに表示する'],jsx:'- ExtendScript(.jsx)として作り、「ファイル > スクリプト > スクリプトファイルを実行」で、アクティブなコンポに一式が生成されるようにする',ctrl:n=>`- コントローラーは「${n}_CTRL」という名前のヌルレイヤーにまとめ、「スライダー制御」エフェクトで作る。シェイプ側のエクスプレッションはそこを参照する`,undo:'- 全体をアンドゥ1回で取り消せるように、app.beginUndoGroup / endUndoGroup で囲む',cmt:'- コードには日本語でコメントを入れる',fin:'- 完成したら、どのパラメータを動かすと何が変わるかを短く説明する',refH:'## 参考エクスプレッション'},
en:{intro:n=>`Please build a tool for After Effects that creates the generative art “${n}”.`,want:'## What I want',look:'- Look: ',use:'- Uses in video: ',bg:'- Background: ',how:'## Approach',ref:'- A reference expression that builds the shape is attached below. Use it as the basis and generate it automatically together with the controllers.',pExt:'## Parameters (settable as arguments of the Python script)',pCtl:'## Controllers (adjustable by changing values in AE)',par:(q)=>`- ${q[0]}: ${q[2]} (default ${q[1]}${q[3]?', range '+q[3]:''})`,stroke:'- Stroke color, stroke width, fill and opacity can be changed from the shape’s Stroke and Fill',anim:'## Animation',mv:d=>`- ${d}. Make it animatable by keyframing the relevant parameter or with a time-based expression, and set up one 5-second loop as a sample`,trim:'- Add Trim Paths so the line can be drawn on (End at 100% by default)',extA:'- If a parameter changes over time, interpolate it per frame and reflect it in the sequence',req:'## Requirements',ae:'- After Effects 2024 or later, JavaScript expression engine',py:['- Use Python 3 + numpy + Pillow, with the required libraries listed in requirements.txt','- Output folder, resolution (default 1920×1080) and frame count can be set as arguments','- Also write an ExtendScript (.jsx) that imports the exported sequence into AE at a given frame rate and places it in the active comp','- The computation is heavy, so show progress in the terminal'],jsx:'- Build it as an ExtendScript (.jsx) that generates everything in the active comp via File > Scripts > Run Script File',ctrl:n=>`- Put the controllers on a null layer named “${n}_CTRL” using Slider Control effects, and have the shape expressions reference it`,undo:'- Wrap everything in app.beginUndoGroup / endUndoGroup so a single undo reverts it',cmt:'- Comment the code in English',fin:'- When done, briefly explain which parameter changes what',refH:'## Reference expression'},
zh:{intro:n=>`請為After Effects製作一個能產生生成藝術「${n}」的工具。`,want:'## 想做的東西',look:'- 外觀: ',use:'- 影像中的用途: ',bg:'- 背景: ',how:'## 做法',ref:'- 下方附上產生形狀的運算式範例作為參考。請以此為基礎,連同控制器一起自動產生。',pExt:'## 參數(可用Python指令碼的引數指定)',pCtl:'## 控制器(可在AE上調整數值)',par:(q)=>`- ${q[0]}: ${q[2]}(預設值 ${q[1]}${q[3]?'、範圍 '+q[3]:''})`,stroke:'- 線條顏色、線寬、填色與不透明度,可從形狀的「筆畫」「填色」修改',anim:'## 動畫',mv:d=>`- ${d}。讓相關參數可用關鍵影格或使用 time 的運算式驅動,並設定一個5秒的循環作為範例`,trim:'- 加入修剪路徑以便做描繪動畫(預設結束為100%)',extA:'- 若有隨時間變化的參數,請逐格內插並反映在序列中',req:'## 需求',ae:'- After Effects 2024以上,運算式引擎為JavaScript',py:['- 使用 Python 3 + numpy + Pillow,所需套件整理在 requirements.txt','- 輸出資料夾、解析度(預設1920×1080)、影格數可用引數指定','- 另外製作一個 ExtendScript(.jsx),以指定影格速率把輸出的序列匯入AE並放進目前的構圖','- 計算量大,請在終端機顯示進度'],jsx:'- 以 ExtendScript(.jsx)製作,執行「檔案 > 指令碼 > 執行指令碼檔案」即可在目前的構圖產生整組內容',ctrl:n=>`- 控制器集中在名為「${n}_CTRL」的Null圖層,用「滑桿控制」效果製作,形狀端的運算式參照它`,undo:'- 整體用 app.beginUndoGroup / endUndoGroup 包起來,一次復原即可取消',cmt:'- 程式碼以繁體中文撰寫註解',fin:'- 完成後,簡短說明調整哪個參數會改變什麼',refH:'## 參考運算式'}};
function buildPrompt(o){const a=o.ae,P=PT[LANG],Pm=(a.p||exprParams(a.code||'')).map(q=>[q[0],q[1],tr(q[2]),q[3]?tr(q[3]):'']),isExt=a.m==='ext',name=tr(o.n),L=[];
L.push(P.intro(name),'',P.want,P.look+tr(o.v),P.use+tr(o.u),P.bg+EXPL[o.n][LANG==='ja'?0:LANG==='en'?1:2],'',P.how,'- '+tr(METH[a.m].p));
if(a.m==='expr'||a.m==='index')L.push(P.ref);
L.push('',isExt?P.pExt:P.pCtl);Pm.forEach(q=>L.push(P.par(q)));if(!isExt)L.push(P.stroke);
L.push('',P.anim);if(o.mv)L.push(P.mv(tr(o.mv.d)));if(!isExt)L.push(P.trim);else L.push(P.extA);
L.push('',P.req,P.ae);if(isExt)L.push(...P.py);else{L.push(P.jsx);if(a.m!=='script')L.push(P.ctrl(name.replace(/[^\w぀-鿿]+/g,'_')));L.push(P.undo)}
L.push(P.cmt,P.fin);if(a.code)L.push('',P.refH,'```javascript',trCode(a.code),'```');return L.join('\n')}

const ALL=[];SEC.forEach(s=>s.it.forEach(i=>ALL.push({n:i[0],v:i[1],u:i[2],f:i[3],mv:i[4]||i[3].mv||null,col:s.c,sec:s.t,sid:s.id,ae:AE[i[0]]})));
ALL.forEach(o=>{if(o.ae&&o.ae.ref){const r=AE[o.ae.ref];o.ae={m:r.m,code:r.code.replace('//   K = 2  …','//   K = 37  …'),note2:o.ae.note2}}});

let idx=0;
document.getElementById('main').innerHTML=SEC.map(s=>`<section id="${s.id}" style="--c:${s.c};margin-bottom:48px"><div class="sh"><h2></h2><span></span></div><div class="grid">${s.it.map(()=>{const k=idx++;return`<button class="card" data-i="${k}"><canvas width="360" height="360" data-i="${k}"></canvas><b><span class="cn"></span><small class="cm"></small></b><p><i class="cl"></i><span class="cv"></span></p><p style="margin-top:4px"><i class="cu"></i><span class="cuu"></span></p></button>`}).join('')}</div></section>`).join('');
function applyLang(){document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;document.title=U('title');document.querySelectorAll('[data-u]').forEach(el=>el.textContent=U(el.dataset.u));document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));document.getElementById('navEl').setAttribute('aria-label',U('nav'));big.setAttribute('aria-label',U('big'));
document.getElementById('nav').innerHTML=SEC.map(s=>`<a href="#${s.id}" style="--c:${s.c}">${tr(s.t)}</a>`).join('');
SEC.forEach(s=>{const sec=document.getElementById(s.id);sec.querySelector('.sh h2').textContent=tr(s.t);sec.querySelector('.sh span').textContent=s.it.length+(U('count')?U('count'):' techniques')});
document.querySelectorAll('.card').forEach(b=>{const o=ALL[+b.dataset.i];b.setAttribute('aria-label',(LANG==='en'?tr(o.n)+U('aria'):tr(o.n)+U('aria')));b.querySelector('.cn').textContent=tr(o.n);const m=b.querySelector('.cm');m.textContent=o.mv?U('mvTag'):'';m.hidden=!o.mv;b.querySelector('.cl').textContent=U('lookS');b.querySelector('.cv').textContent=tr(o.v);b.querySelector('.cu').textContent=U('useS');b.querySelector('.cuu').textContent=tr(o.u)});
heroText();showHow();note()}

function prep(c,S,col){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.clearRect(0,0,S,S);c.strokeStyle=c.fillStyle=col;c.lineWidth=S/300*1.2;c.lineJoin='round';c.lineCap='round';c.imageSmoothingEnabled=true}
function render(cv,i){const S=cv.width,c=cv.getContext('2d'),o=ALL[i];prep(c,S,o.col);try{o.f(c,S,o.col)}catch(e){console.error(o.n,e)}}

const IMGU=400;
function record(o,S){const ops=[];const px=new Proxy({},{get(t,k){if(k==='createImageData')return(w,h)=>({width:w,height:h,data:new Uint8ClampedArray(w*h*4)});return(...a)=>{ops.push([k,a])}},set(t,k,v){ops.push(['=',[k,v]]);return true}});px.strokeStyle=o.col;px.fillStyle=o.col;px.lineWidth=S/300*1.2;try{o.f(px,S,o.col)}catch(e){console.error(o.n,e)}let u=0;for(const[k]of ops){if(k==='lineTo'||k==='arc'||k==='fillRect'||k==='strokeRect')u++;else if(k==='putImageData')u+=IMGU}return{ops,u}}
function replay(c,ops,budget){let used=0;for(let i=0;i<ops.length;i++){const[k,a]=ops[i];if(k==='='){c[a[0]]=a[1];continue}if(k==='lineTo'||k==='arc'){if(used>=budget){for(let j=i;j<ops.length;j++){const kk=ops[j][0];if(kk==='stroke'||kk==='fill'){c[kk]();break}if(kk==='beginPath')break}return}used++;c[k](...a);continue}if(k==='fillRect'||k==='strokeRect'){if(used>=budget)return;used++;c[k](...a);continue}if(k==='putImageData'){const im=a[0];if(!im._r)im._r=new ImageData(im.data,im.width,im.height);const h=Math.floor(im.height*Math.min(1,(budget-used)/IMGU));if(h<=0)return;c.putImageData(im._r,a[1],a[2],0,0,im.width,h);used+=IMGU;if(used>budget)return;continue}if(typeof c[k]==='function')c[k](...a)}}

const big=document.getElementById('big'),bc=big.getContext('2d'),BS=big.width,hero=document.getElementById('hero'),bD=document.getElementById('bDraw'),bM=document.getElementById('bMove'),bS=document.getElementById('bStop'),hM=document.getElementById('hM');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0,raf=0,mode='',rec=null,mvFn=null,t0=0,vis=true;
const recCache=new Map();
function setBtns(){bD.classList.toggle('on',mode==='draw');bM.classList.toggle('on',mode==='move');bM.hidden=!ALL[cur].mv;bD.setAttribute('aria-pressed',mode==='draw');bM.setAttribute('aria-pressed',mode==='move')}
function note(){const o=ALL[cur];hM.textContent=mode==='move'?U('mvP')+tr(o.mv.d):mode==='draw'?U('drawN'):o.mv?U('mvP')+tr(o.mv.d):U('drawOnly')}
function stop(){cancelAnimationFrame(raf);raf=0;mode='';setBtns();note()}
function frame(now){raf=requestAnimationFrame(frame);if(!vis)return;const o=ALL[cur],t=Math.max(0,(now-t0)/1000);prep(bc,BS,o.col);try{if(mode==='draw'){const dur=Math.min(6,2.5+Math.log10(1+rec.u)*.9),p=Math.min(1,t/dur),e=p<.5?2*p*p:1-2*(1-p)*(1-p);replay(bc,rec.ops,rec.u*e+.5);if(t>dur+1.6)t0=now}else mvFn(bc,t)}catch(err){console.error(o.n,err);stop();render(big,cur)}}
function play(m){cancelAnimationFrame(raf);const o=ALL[cur];mode=m;if(m==='draw'){if(!recCache.has(cur)){if(recCache.size>6)recCache.delete(recCache.keys().next().value);recCache.set(cur,record(o,BS))}rec=recCache.get(cur)}else mvFn=o.mv.a(BS,o.col);t0=performance.now();setBtns();note();raf=requestAnimationFrame(frame)}
function heroText(){const o=ALL[cur];document.getElementById('hTag').textContent=tr(o.sec);document.getElementById('hName').textContent=tr(o.n);document.getElementById('hV').textContent=tr(o.v);document.getElementById('hU').textContent=tr(o.u);document.getElementById('hX').textContent=EXPL[o.n][LANG==='ja'?0:LANG==='en'?1:2]}
function feature(i,scroll){stop();cur=(i+ALL.length)%ALL.length;const o=ALL[cur];hero.style.setProperty('--c',o.col);document.getElementById('how').style.setProperty('--c',o.col);heroText();setBtns();note();showHow();if(scroll)hero.scrollIntoView({block:'start'});if(reduce)requestAnimationFrame(()=>render(big,cur));else setTimeout(()=>play(o.mv?'move':'draw'),30)}

let tab='E';const tE=document.getElementById('tE'),tP=document.getElementById('tP'),howMeta=document.getElementById('howMeta'),howPre=document.getElementById('howPre'),howCode=document.getElementById('howCode'),cpy=document.getElementById('copy');
function showHow(){const o=ALL[cur],a=o.ae;tE.setAttribute('aria-selected',tab==='E');tP.setAttribute('aria-selected',tab==='P');howMeta.innerHTML='';const tg=document.createElement('span');tg.className='tag';tg.textContent=U('meth')+tr(METH[a.m].l);howMeta.appendChild(tg);let msg='',txt='';
if(tab==='P'){msg=U('promptNote');txt=buildPrompt(o)}
else if(a.code){msg=(a.note2?tr(a.note2)+' ':'')+U(a.m==='index'?'howIndex':'howExpr');txt=trCode(a.code)}
else{msg=tr(a.note)+U('useP')}
howMeta.appendChild(document.createTextNode(msg));howCode.textContent=txt;howPre.hidden=!txt;howPre.classList.toggle('wrap',tab==='P');cpy.hidden=!txt;cpy.textContent=U('copy')}
tE.onclick=()=>{tab='E';showHow()};tP.onclick=()=>{tab='P';showHow()};
cpy.onclick=async()=>{const t=howCode.textContent;try{await navigator.clipboard.writeText(t);cpy.textContent=U('copied')}catch(e){const r=document.createRange();r.selectNodeContents(howCode);const s=getSelection();s.removeAllRanges();s.addRange(r);cpy.textContent=U('selected')}setTimeout(()=>cpy.textContent=U('copy'),2200)};
bD.onclick=()=>play('draw');bM.onclick=()=>{if(ALL[cur].mv)play('move')};bS.onclick=()=>{stop();render(big,cur)};
document.getElementById('prev').onclick=()=>feature(cur-1);
document.getElementById('next').onclick=()=>feature(cur+1);
document.getElementById('rand').onclick=()=>feature((Math.random()*ALL.length)|0);
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>feature(+b.dataset.i,true)));
if('IntersectionObserver' in window){const hv=new IntersectionObserver(es=>{vis=es[0].isIntersecting});hv.observe(big)}

const queue=[];let busy=false;
function pump(){if(busy)return;busy=true;const step=()=>{const t=performance.now();while(queue.length&&performance.now()-t<20){const cv=queue.shift();render(cv,+cv.dataset.i)}if(queue.length)requestAnimationFrame(step);else busy=false};requestAnimationFrame(step)}
const cvs=document.querySelectorAll('.card canvas');
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);queue.push(e.target)}});pump()},{rootMargin:'400px'});cvs.forEach(cv=>io.observe(cv))}else{cvs.forEach(cv=>queue.push(cv));pump()}
try{const sv=localStorage.getItem('gaLang');LANG=sv&&UI[sv]?sv:(/^zh/i.test(navigator.language)?'zh':/^ja/i.test(navigator.language)?'ja':'en')}catch(e){LANG=/^zh/i.test(navigator.language)?'zh':/^ja/i.test(navigator.language)?'ja':'en'}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('gaLang',LANG)}catch(e){}applyLang()});
cur=ALL.findIndex(o=>o.n==='掛け算の円 ×2');applyLang();feature(cur);
}
</script>
